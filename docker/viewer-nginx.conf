server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # adapter-static emits a SPA fallback page; serve files when present,
    # otherwise hand off to the app shell (client-side routing + ?scenario=).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx 1.27's bundled mime.types already maps application/wasm.

    gzip on;
    gzip_types application/javascript application/wasm text/css image/svg+xml;
}
