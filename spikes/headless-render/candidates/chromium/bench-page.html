<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>bino spike: chromium bench</title>
    <style>
      html,
      body,
      canvas {
        margin: 0;
        padding: 0;
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script type="module">
      import * as THREE from "three";
      import { buildScene } from "/scene.mjs";

      // We need a depth-encoded RGBA pass — the same lidar-readback story as
      // the gl candidates. We use MeshDepthMaterial with RGBADepthPacking.
      const depthOverride = new THREE.MeshDepthMaterial({
        depthPacking: THREE.RGBADepthPacking,
        blending: THREE.NoBlending,
      });

      function fnv1a(buf) {
        let h = 0x811c9dc5;
        for (let i = 0; i < buf.length; i += 257) {
          h ^= buf[i];
          h = Math.imul(h, 0x01000193);
        }
        return ("00000000" + (h >>> 0).toString(16)).slice(-8);
      }

      window.__bench = async function (width, height, frames, warmup = 20) {
        const canvas = document.getElementById("canvas");
        canvas.width = width;
        canvas.height = height;

        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: false,
          powerPreference: "high-performance",
          preserveDrawingBuffer: true,
        });
        renderer.setSize(width, height, false);
        renderer.setPixelRatio(1);

        const colorTarget = new THREE.WebGLRenderTarget(width, height, {
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBAFormat,
          type: THREE.UnsignedByteType,
          depthBuffer: true,
          stencilBuffer: false,
        });
        const depthTarget = new THREE.WebGLRenderTarget(width, height, {
          minFilter: THREE.NearestFilter,
          magFilter: THREE.NearestFilter,
          format: THREE.RGBAFormat,
          type: THREE.UnsignedByteType,
          depthBuffer: true,
          stencilBuffer: false,
        });

        const { scene, camera, animate } = buildScene({ width, height });

        const colorBuf = new Uint8Array(width * height * 4);
        const depthBuf = new Uint8Array(width * height * 4);

        const renderFrame = () => {
          renderer.setRenderTarget(colorTarget);
          renderer.clear(true, true, false);
          renderer.render(scene, camera);

          const prev = scene.overrideMaterial;
          scene.overrideMaterial = depthOverride;
          renderer.setRenderTarget(depthTarget);
          renderer.clear(true, true, false);
          renderer.render(scene, camera);
          scene.overrideMaterial = prev;
        };

        for (let i = 0; i < warmup; i++) {
          animate(i / 60);
          renderFrame();
          renderer.readRenderTargetPixels(colorTarget, 0, 0, width, height, colorBuf);
        }

        const stage = {
          step: new Float64Array(frames),
          render: new Float64Array(frames),
          readColor: new Float64Array(frames),
          readDepth: new Float64Array(frames),
        };

        const t0 = performance.now();
        for (let i = 0; i < frames; i++) {
          const t = (warmup + i) / 60;

          let s = performance.now();
          animate(t);
          stage.step[i] = performance.now() - s;

          s = performance.now();
          renderFrame();
          stage.render[i] = performance.now() - s;

          s = performance.now();
          renderer.readRenderTargetPixels(colorTarget, 0, 0, width, height, colorBuf);
          stage.readColor[i] = performance.now() - s;

          s = performance.now();
          renderer.readRenderTargetPixels(depthTarget, 0, 0, width, height, depthBuf);
          stage.readDepth[i] = performance.now() - s;
        }
        const totalMs = performance.now() - t0;

        const avg = (a) => a.reduce((s, v) => s + v, 0) / a.length;
        const p = (a, q) => {
          const s = [...a].sort((x, y) => x - y);
          return s[Math.min(s.length - 1, Math.floor(s.length * q))];
        };

        // Sample/decode depth strip across center scanline.
        const cy = (height >> 1) * width * 4;
        const depthStrip = [];
        for (let x = 0; x < width; x += width >> 4) {
          const idx = cy + x * 4;
          const d =
            depthBuf[idx + 3] / 256 +
            depthBuf[idx + 2] / 65536 +
            depthBuf[idx + 1] / 16777216 +
            depthBuf[idx + 0] / 4294967296;
          depthStrip.push(+d.toFixed(4));
        }

        // Color non-zero count
        let nonZero = 0;
        for (let i = 0; i < colorBuf.length; i += 4) {
          if (colorBuf[i] | colorBuf[i + 1] | colorBuf[i + 2]) nonZero++;
        }

        // Capture WebGL info
        const gl = renderer.getContext();
        const dbg = gl.getExtension("WEBGL_debug_renderer_info");
        const glRenderer = dbg
          ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)
          : gl.getParameter(gl.RENDERER);
        const glVendor = dbg
          ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)
          : gl.getParameter(gl.VENDOR);
        const glVersion = gl.getParameter(gl.VERSION);

        // Draw last frame to the canvas back-buffer so a CDP screenshot
        // captures something representative — outside the timing loop.
        renderer.setRenderTarget(null);
        renderer.render(scene, camera);

        return {
          name: "chromium",
          width,
          height,
          frames,
          warmup,
          totalMs,
          fps: (frames / totalMs) * 1000,
          perFrameMs: totalMs / frames,
          stage: {
            step: { avg: avg(stage.step), p50: p(stage.step, 0.5), p95: p(stage.step, 0.95) },
            render: {
              avg: avg(stage.render),
              p50: p(stage.render, 0.5),
              p95: p(stage.render, 0.95),
            },
            readColor: {
              avg: avg(stage.readColor),
              p50: p(stage.readColor, 0.5),
              p95: p(stage.readColor, 0.95),
            },
            readDepth: {
              avg: avg(stage.readDepth),
              p50: p(stage.readDepth, 0.5),
              p95: p(stage.readDepth, 0.95),
            },
          },
          sanity: {
            colorBytes: colorBuf.length,
            colorHash: fnv1a(colorBuf),
            colorNonZero: nonZero,
            depthBytes: depthBuf.length,
            depthSampleEvery10pct: Array.from(
              { length: 10 },
              (_, i) => depthBuf[Math.floor((depthBuf.length * i) / 10)],
            ),
          },
          depthStrip,
          glVersion,
          glRenderer,
          glVendor,
        };
      };

      // Expose the buffers via a separate getter so we can ferry them through
      // CDP after the timed loop completes — keeps marshalling out of the
      // timing path. We'll fetch them via page.evaluate(() => __getColor()).
      window.__getColor = () => null; // populated below
      window.__getDepth = () => null;

      window.__ready = true;
    </script>
  </body>
</html>
