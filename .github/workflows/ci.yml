name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: [kernels]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: wasm-kernels
          path: packages/core/wasm
      - run: pnpm install --frozen-lockfile
      # @bino/node and @bino/viewer resolve @bino/core to its built dist.
      - run: pnpm --filter @bino/core build
      - run: pnpm typecheck

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    needs: [kernels]
    strategy:
      matrix:
        package: [core, node]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: wasm-kernels
          path: packages/core/wasm
      - run: pnpm install --frozen-lockfile
      # @bino/node tests import the built @bino/core package.
      - run: pnpm --filter @bino/core build
      - run: pnpm --filter @bino/${{ matrix.package }} test

  kernels:
    name: Rust Kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernels
      - run: cargo install wasm-bindgen-cli@0.2.120
      - run: cd kernels && cargo test --release
      # `pnpm kernels:build` needs pnpm (above) on PATH; wasm-bindgen is on
      # PATH from `cargo install` (~/.cargo/bin), so no PATH override.
      - run: pnpm kernels:build
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-kernels
          path: packages/core/wasm/
          retention-days: 1
