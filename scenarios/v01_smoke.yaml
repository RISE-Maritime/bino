# v0.1 smoke scenario — one tanker (ego) + one ferry, anchored at Kiel.
# Used by the integration test (plan #16) and as the canonical example
# for ad-hoc CLI runs:
#
#   bino-node scenarios/v01_smoke.yaml
#   bino-node scenarios/v01_smoke.yaml --zenoh ws://127.0.0.1:10000

scenario:
  name: v01_smoke
  keelson:
    base_path: bino
  anchor:
    lat: 54.3233
    lon: 10.1394
    height: 0.0

  vessels:
    - id: ego
      model: tanker_120m
      pose_source:
        type: zenoh
        # Keelson convention: {base}/@v0/{entity}/pubsub/{subject}/{source}.
        # frame_transform → foxglove.FrameTransform inside a Keelson Envelope.
        topic: bino/@v0/ego/pubsub/frame_transform/sim
      sensors:
        - id: bow_camera
          type: camera
          # Mount placed well in front of the placeholder hull so the
          # camera doesn't self-occlude. Real assets at v0.5 will use
          # vessel-specific bow positions.
          mount: { x: 20, y: 8, z: 0 }
          fov_deg: 90
          resolution: [640, 480]
          rate_hz: 10
        - id: main_lidar
          type: lidar
          mount: { x: 20, y: 8, z: 0 }
          channels: 32
          range_m: 200
          rate_hz: 10
        - id: main_radar
          type: radar_marine
          # Masthead mount, well above the hull.
          mount: { x: 0, y: 35, z: 0 }
          range_m: 2000
          rotation_rate_hz: 0.4
          beam_width_deg: 1.2
          spokes_per_rev: 360
          range_bins: 200

    - id: ferry
      model: ferry_60m
      pose_source:
        type: zenoh
        topic: bino/@v0/ferry/pubsub/frame_transform/sim
      sensors: []

  modes:
    rendering: replace
    clock: wall
    determinism: relaxed
