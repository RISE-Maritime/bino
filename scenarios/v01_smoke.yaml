# v0.1 smoke scenario — one tanker (ego) + one ferry, anchored at Kiel.
# Used by the integration test (plan #16) and as the canonical example
# for ad-hoc CLI runs:
#
#   bino-node scenarios/v01_smoke.yaml
#   bino-node scenarios/v01_smoke.yaml --zenoh ws://127.0.0.1:10000

scenario:
  name: v01_smoke
  anchor:
    lat: 54.3233
    lon: 10.1394
    height: 0.0

  vessels:
    - id: ego
      model: tanker_120m
      pose_source:
        type: zenoh
        topic: keelson/ego/nav/pose
      sensors:
        - id: bow_camera
          type: camera
          # Mount placed well in front of the placeholder hull so the
          # camera doesn't self-occlude. Real assets at v0.5 will use
          # vessel-specific bow positions.
          mount: { x: 20, y: 0, z: 8 }
          fov_deg: 90
          resolution: [640, 480]
          rate_hz: 10
        - id: main_lidar
          type: lidar
          mount: { x: 20, y: 0, z: 8 }
          channels: 32
          range_m: 200
          rate_hz: 10

    - id: ferry
      model: ferry_60m
      pose_source:
        type: zenoh
        topic: keelson/ferry/nav/pose
      sensors: []

  modes:
    rendering: replace
    clock: wall
    determinism: relaxed
