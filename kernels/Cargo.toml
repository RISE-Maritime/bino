[workspace]
resolver = "2"
members = ["radar", "lidar"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
wasm-bindgen = "0.2.120"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
